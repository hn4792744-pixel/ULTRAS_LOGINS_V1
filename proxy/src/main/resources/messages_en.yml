value-expired:
  - "expired"
value-active:
  - "active until"
config-reloaded:
  - "<prefix> <success>✓ Configuration reloaded."
config-reload-warnings:
  - "<prefix> <warning>Reloaded with %count% warning(s). Check the console."

# ---------------------------------------------------------------- language
language-usage:
  - "<prefix> <main>Usage: <accent>/language <en|ar>"
language-changed:
  - "<prefix> <success>✓ Language set to %language%."

