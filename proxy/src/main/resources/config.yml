# ============================================================
# Ultras Login v1  -  إعدادات نظام تسجيل الدخول (Velocity)
# المطور: UC_Hussein
# ============================================================
# ملاحظات عامة:
#  - لا تستخدم الكلمات on / off / yes / no بدون علامات اقتباس، لأن YAML يحولها إلى true/false.
#    استخدم true أو false فقط للقيم المنطقية.
#  - بعد التعديل نفّذ الأمر:  /ultraslogin reload
#    (قاعدة البيانات، أسماء الأوامر البديلة aliases، وسر الجسر تحتاج إعادة تشغيل البروكسي).
#  - هذا الملف يحتوي إعدادات قاعدة البيانات، فلا تشاركه مع أحد.

# رقم نسخة الملف. لا تغيّره: عند تحديث الإضافة يتم نسخ الملف القديم باسم config.yml.old-<الوقت>
# ثم استبداله بالنسخة الجديدة.
file-version: 1

# ============================================================
# قاعدة البيانات
# ============================================================
database:
  # نوع قاعدة البيانات: SQLITE (افتراضي، ملف محلي) أو MARIADB أو MYSQL
  # للشبكات التي فيها أكثر من بروكسي أو أكثر من سيرفر يُنصح بـ MARIADB / MYSQL.
  # ملاحظة: MYSQL يعمل عبر تعريف MariaDB Connector/J.
  type: SQLITE

  # اسم ملف SQLite داخل مجلد الإضافة (يُستخدم فقط عند type: SQLITE)
  sqlite-file: accounts.db

  # بيانات الاتصال بـ MariaDB / MySQL (تُستخدم فقط عند اختيارهما)
  host: localhost
  port: 3306
  database: ultras_login
  username: root
  # كلمة مرور قاعدة البيانات. لا تُسجَّل في السجلات أبدًا.
  password: "CHANGE_ME"

  # أقصى عدد اتصالات في المجمّع (MariaDB / MySQL فقط)
  pool-size: 8

  # وضع SSL لـ MariaDB: disable أو trust أو verify-full
  ssl-mode: disable

# ============================================================
# أمان كلمات المرور
# ============================================================
password:
  # خوارزمية التشفير. المدعوم فقط: ARGON2ID
  # كلمات المرور لا تُخزَّن نصًا أبدًا؛ يُخزَّن الـ hash مع الـ salt والمعاملات فقط.
  algorithm: ARGON2ID

  # أقل طول لكلمة المرور
  minimum-length: 6
  # أقصى طول لكلمة المرور
  maximum-length: 72

  # شروط التعقيد (كلها اختيارية)
  require-uppercase: false
  require-lowercase: false
  require-number: false
  require-symbol: false

  # معاملات Argon2id. رفعها يزيد الأمان لكنه يستهلك ذاكرة ومعالجًا أكثر عند كل تسجيل دخول.
  # كلمات المرور القديمة تتحدّث تلقائيًا إلى المعاملات الجديدة عند أول دخول ناجح.
  argon2:
    # الذاكرة بالكيلوبايت (32768 = 32 ميغابايت)
    memory-kb: 32768
    # عدد التكرارات
    iterations: 3
    # التوازي
    parallelism: 1

  # أقصى عدد عمليات hashing تعمل في نفس الوقت (حماية من استهلاك الذاكرة). يتطلب إعادة تشغيل.
  max-concurrent-hashes: 2
  # لمنع كلمات المرور الشائعة: أنشئ ملف password-blacklist.txt في مجلد الإضافة (كلمة في كل سطر).

# ============================================================
# الجلسات (Sessions)
# ============================================================
sessions:
  # تفعيل الجلسات: يسمح بإعادة الدخول بدون /login خلال المدة المحددة
  enabled: true

  # مدة الجلسة بالدقائق. تبدأ من لحظة خروج اللاعب.
  duration-minutes: 1

  # ربط الجلسة بالـ IP كطبقة أمان إضافية (الـ IP لا يُعتبر هوية وحده، ولا يُخزَّن نصًا بل بصيغة hash مفتاحية)
  bind-to-ip: true

  # إذا تغيّر الـ IP تُلغى الجلسة فورًا ويُطلب /login (يعمل مع bind-to-ip: true)
  require-login-on-ip-change: true

  # بعد انتهاء المدة يُطلب /login من جديد (false = لا تنتهي الجلسات بالوقت)
  require-login-after-timeout: true

  # سياسة الاتصال المتزامن بنفس الحساب. القيمة الآمنة والوحيدة المطبّقة على Velocity: DENY_NEW
  # (Velocity يرفض اتصالين بنفس UUID، وطرد القديم يسمح بسرقة الحساب). القيم الأخرى تتحول إلى DENY_NEW مع تحذير.
  concurrent-login-policy: DENY_NEW

# ============================================================
# الأمان وحماية القوة الغاشمة (Brute force)
# ============================================================
security:
  # تقييد اللاعب قبل تسجيل الدخول (يتحكم به الجسر على السيرفر الخلفي)
  restrict-before-login: true

  # عدد محاولات كلمة المرور الخاطئة قبل الحظر المؤقت
  max-login-attempts: 5

  # مدة الحظر المؤقت بالدقائق
  lockout-minutes: 5

  # طرد اللاعب عند تجاوز المحاولات
  kick-on-lockout: true

  # طلب كلمة المرور عند حذف التسجيل:  /un_register <password>
  # (يمنع شخصًا جلس على جهاز مفتوح من حذف حماية الحساب)
  unregister-requires-password: true

  # بعد /un_register يُنقل اللاعب فورًا إلى عالم التسجيل ويُطلب منه /register
  unregister-require-register-immediately: true

  # يجب أن يطابق اسم اللاعب (الكراكد) حالة الأحرف المسجّلة (Steve ≠ steve) لمنع تجاوز الحساب
  enforce-username-case: true

# ============================================================
# اللاعبون الأصليون (Premium)
# ============================================================
# كيف يعمل: عند الاتصال يُسأل Mojang هل الاسم لحساب أصلي. إذا نعم يُجبَر اللاعب على التحقق
# عبر جلسة Mojang الرسمية (Velocity online mode). لاعب كراكد يستخدم اسم لاعب أصلي يُرفض
# ولا يرث حسابه أبدًا. اللاعب الأصلي الموثّق لا يرى /register ولا /login.
premium:
  # تفعيل التحقق من الحسابات الأصلية
  enabled: true

  # مدة حفظ نتيجة "الاسم أصلي" بالدقائق
  cache-minutes: 30
  # مدة حفظ نتيجة "الاسم غير أصلي" بالدقائق
  negative-cache-minutes: 5
  # مدة حفظ فشل الاتصال بـ Mojang بالثواني (لتجنب إغراق الخدمة)
  error-cache-seconds: 20

  # رابط الاستعلام عن الاسم. %name% يُستبدل بالاسم (يُتحقق منه مسبقًا: حروف وأرقام و _ فقط)
  lookup-url: "https://api.minecraftservices.com/minecraft/profile/lookup/name/%name%"
  # مهلة الاتصال بالثواني
  timeout-seconds: 4

  # عند تعذّر التحقق من Mojang (الخدمة متوقفة):
  # KICK    = رفض الاتصال (الافتراضي، الأكثر أمانًا)
  # CRACKED = معاملة اللاعب ككراكد (يحتاج كلمة مرور). لا يُمنح أي حساب أصلي معروف لأحد في كل الحالات.
  verification-failure:
    mode: KICK

  # إذا كان الاسم مسجّلًا عندنا كحساب كراكد بكلمة مرور ثم أصبح الاسم أصليًا لاحقًا:
  # KEEP_CRACKED  = يبقى الحساب الكراكد يعمل (الافتراضي، المالك الأصلي يحتاج حلًا إداريًا)
  # FORCE_PREMIUM = الاسم يُجبَر على التحقق الأصلي (الحساب الكراكد القديم لن يستطيع الدخول)
  registered-cracked-name-policy: KEEP_CRACKED

# ============================================================
# اللاعبون الكراكد (Offline)
# ============================================================
cracked:
  # السماح بدخول الكراكد (يتطلب /register و /login)
  enabled: true

# ============================================================
# Bedrock (Geyser + Floodgate)
# ============================================================
# يتم التعرف على Bedrock عبر Floodgate API الرسمي فقط، وليس من الاسم.
bedrock:
  # دعم لاعبي Bedrock (false = يُرفضون)
  enabled: true

  # false = Bedrock يدخلون تلقائيًا بدون /register و /login
  # true  = Bedrock يتبعون نفس نظام الكراكد (عالم التسجيل، الجلسات، IP)
  require-authentication: false

# ============================================================
# المواقع
# ============================================================
# mode:
#   SERVER   = الاتصال بسيرفر Velocity فقط (بدون نقل داخلي)
#   WORLD    = بعد الاتصال يتم نقله لعالم محدد (عبر الجسر)
#   LOCATION = نقله لإحداثيات محددة داخل العالم (عبر الجسر)
# Velocity لا يستطيع النقل بين عوالم السيرفر الواحد؛ الجسر هو الذي يفعل ذلك.
locations:
  # موقع المصادقة (يرسل إليه اللاعب غير المسجّل)
  authentication:
    mode: SERVER
    # اسم السيرفر كما هو في velocity.toml
    server: auth
    world: login
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

  # موقع السبون الرئيسي بعد نجاح المصادقة
  spawn:
    mode: SERVER
    server: survival
    world: world
    x: 0.5
    y: 80.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# ============================================================
# اللغة وواجهة الإعدادات (GUI)
# ============================================================
language:
  # اللغة الافتراضية قبل أن يختار اللاعب لغته: en أو ar
  default: en
  # واجهة أول دخول: FIRST_JOIN (لغة + إشعارات + أصوات) أو LANGUAGE (اختيار اللغة فقط)
  # اللاعب لا يستطيع إغلاق الواجهة قبل اختيار اللغة. شكل الواجهة في gui.yml
  first-join-gui: FIRST_JOIN

# الرسائل التعليمية الاختيارية (نصائح). لا تُعطّل أبدًا رسائل الأمان أو التسجيل أو الأخطاء.
education:
  enabled: true

# ============================================================
# التقييدات قبل تسجيل الدخول (يطبّقها الجسر على السيرفر الخلفي)
# ============================================================
restrictions:
  movement: true
  # عند movement: false فقط. المنع بالقفز تقديري (بحسب تغيّر الارتفاع) لأن Paper لا يوفر حدثًا موثوقًا
  jumping: true
  sprinting: true
  interaction: true
  block-break: true
  block-place: true
  damage: true
  inventory: true
  item-drop: true
  item-pickup: true
  chat: false
  commands: true
  teleport: true
  # منع الانتقال لسيرفرات أخرى قبل تسجيل الدخول (يطبّقه Velocity)
  server-switch: true

# ============================================================
# الأوامر
# ============================================================
commands:
  # الأوامر المسموحة قبل تسجيل الدخول (بدون /). أي أمر آخر يُحظر ويُخفى من Tab
  allowed-before-login:
    - login
    - register
    - language

  # أسماء بديلة (aliases) للأوامر. تحتاج إعادة تشغيل البروكسي. مثال: login: [l]
  aliases:
    login: []
    register: []
    un_register: []
    language: []
    register_info: []
    ultraslogin: []

# ============================================================
# التذكير بتسجيل الدخول
# ============================================================
login-reminder:
  # false = تُرسل الرسالة الأولى فقط ولا يتكرر التذكير
  enabled: true
  # الفاصل بين التذكيرات بالثواني
  interval-seconds: 10
  # قنوات العرض (يمكن الجمع بينها). title و actionbar و bossbar تحتاج تفعيلها أيضًا في قسم ui
  mode:
    chat: true
    actionbar: false
    title: false
    bossbar: false

# ============================================================
# عناصر الواجهة (Title / ActionBar / BossBar)
# ============================================================
ui:
  title:
    enabled: false
  actionbar:
    enabled: true
  bossbar:
    enabled: false
    # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
    color: RED
    # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: PROGRESS

# ============================================================
# الأصوات (هادئة وقابلة للتعديل)
# ============================================================
# الأصوات يشغّلها الجسر على السيرفر الخلفي. اكتب اسم الصوت بصيغة Minecraft مثل ui.button.click
# صوت غير موجود لا يسبب أي خطأ (لن يُسمع شيء). لاعب يستطيع إيقاف الأصوات من /register setting
sounds:
  enabled: true
  success:
    sound: ui.button.click
    volume: 0.35
    pitch: 1.15
  error:
    sound: block.note_block.bass
    volume: 0.25
    pitch: 0.8
  language:
    sound: ui.button.click
    volume: 0.25
    pitch: 1.1
  toggle:
    sound: ui.button.click
    volume: 0.2
    pitch: 1.0

# ============================================================
# تحديد معدل الطلبات (Rate limiting)
# ============================================================
rate-limit:
  # أوامر /login و /un_register: الحد خلال النافذة (لكل لاعب)
  auth-commands:
    limit: 5
    window-seconds: 10
  # /register (لكل لاعب ولكل IP)
  register:
    limit: 3
    window-seconds: 60
  # الأوامر العامة للإضافة والنقرات في الواجهة
  commands:
    limit: 10
    window-seconds: 5
  # أقصى عدد طلبات إلى Mojang في الدقيقة (حماية من إغراق الخدمة)
  mojang-requests-per-minute: 60

# ============================================================
# الجسر (Bridge) مع السيرفرات الخلفية Paper / Purpur
# ============================================================
bridge:
  # سر مشترك لتوقيع الرسائل (HMAC). اتركه فارغًا ليولّد البروكسي ملف bridge-secret.key تلقائيًا
  # ثم انسخ محتواه إلى secret: في config.yml الخاص بالجسر على كل سيرفر خلفي. لا تشاركه.
  secret: ""
  # المهلة بالثواني لانتظار رد الجسر بعد دخول سيرفر. اللاعب غير المسجّل يُطرد إن لم يُجب الجسر
  # لأن التقييدات لا يمكن فرضها بدونه.
  hello-timeout-seconds: 10
  # true = اطرد أي لاعب على سيرفر بلا جسر (حتى المسجّل). false = يُسمح للمسجّلين مع تحذير في الكونسول
  require-on-all-servers: false
  # أقصى فرق ساعة مسموح بين البروكسي والسيرفر الخلفي بالثواني
  max-clock-skew-seconds: 60

# ============================================================
# الهوية البصرية للرسائل
# ============================================================
# البادئة تظهر بخط عادي (ليس Small Caps) وبتدرج أحمر:   UC |
prefix:
  enabled: true
  text: "UC"
  separator: "|"
  gradient:
    enabled: true
    # من الأحمر الفاتح إلى الغامق
    start: "#ff5a4d"
    end: "#8b0000"
  # رمز السطر الثانوي
  dot: "◦"

# الألوان (hex أو اسم لون). تُستخدم في الرسائل كوسوم مثل <success> و <warning>
colors:
  success: "#7bd88f"
  error: "#ff6b6b"
  warning: "#e8b04b"
  info: "#9fd8e6"
  main: "#e6e6e6"
  muted: "#8a8a8a"
  sep: "#5c5c5c"
  accent: "#ff5a5a"

# ============================================================
# السجلات
# ============================================================
# أحداث الأمان تُكتب في logs/security-<التاريخ>.log (لا تحتوي كلمات مرور أو hash أو مفاتيح أبدًا)
logging:
  # إظهار أحداث الأمان في الكونسول أيضًا
  console: true
