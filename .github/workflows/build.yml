name: Build Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Velocity
        run: gradle :proxy:shadowJar

      - name: Build Paper
        run: gradle :bridge:build

      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ultras_login_v1-proxy
          path: proxy/build/libs/Ultras_login_v1-proxy.jar

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ultras_login_v1-bridge
          path: bridge/build/libs/Ultras_login_v1-bridge.jar
