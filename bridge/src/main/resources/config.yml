# ============================================================
# Ultras Login v1 - إعدادات الـ Bridge (سيرفر Paper / Purpur)
# ============================================================
# هذا الملف يوضع على كل سيرفر خلفي (auth + survival ...). الـ Bridge لا يخزّن كلمات مرور،
# كل المنطق على Velocity، وهو فقط ينفّذ القيود ويرسم القوائم.

# السر المشترك مع Velocity: انسخ محتوى الملف plugins/ultras_login/bridge-secret.key
# من البروكسي (أو الذي وضعته في bridge.secret) إلى هنا. يجب أن يتطابق حرفياً.
# بدون سر صحيح (16 حرفاً على الأقل) يبقى كل اللاعبين مقيّدين (الوضع الآمن).
secret: ""

# true = أي لاعب لم يردّ عليه البروكسي بعد يبقى مقيّداً (الوضع الآمن الموصى به).
# false = يُترك اللاعب حراً حتى يصل أول أمر من البروكسي (لا تستخدمه على سيرفر الدخول).
restrict-until-synced: true

# أقصى فرق مسموح بين ساعة البروكسي وساعة هذا السيرفر (ثوانٍ) لقبول رسالة موقّعة.
max-clock-skew-seconds: 60
